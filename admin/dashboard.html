<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Alchimia Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/admin.css">
<style>
  /* ---- Dashboard-specific styles ---- */
  .dashboard-greeting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }
  .greeting-left h1 {
    font-size: 1.55rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .greeting-left h1 span { color: var(--admin-accent); }
  .greeting-left p {
    font-size: .83rem;
    color: var(--admin-muted);
    margin-top: 5px;
  }
  .greeting-date {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--admin-muted);
    background: rgba(255,255,255,.04);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    white-space: nowrap;
  }

  /* ---- Pending alert ---- */
  .pending-alert {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(245,158,11,.08);
    border: 1px solid rgba(245,158,11,.25);
    border-radius: var(--radius);
    padding: 13px 18px;
    margin-bottom: 24px;
    font-size: .875rem;
    color: var(--admin-warning);
    animation: fadeInUp .4s var(--ease) both;
  }
  .pending-alert strong { font-weight: 600; }
  .pending-alert a {
    margin-left: auto;
    font-size: .78rem;
    font-weight: 600;
    color: var(--admin-warning);
    text-decoration: underline;
    white-space: nowrap;
  }
  .pending-alert a:hover { color: #fff; }

  /* ---- Stat cards ---- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--admin-card);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-lg);
    padding: 22px 22px 18px;
    position: relative;
    overflow: hidden;
    transition: transform .22s var(--ease), box-shadow .22s var(--ease);
    animation: fadeInUp .5s var(--ease) both;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 90px; height: 90px;
    border-radius: 0 var(--radius-lg) 0 120%;
    opacity: .07;
    pointer-events: none;
  }
  .stat-card.green::after  { background: var(--admin-accent); }
  .stat-card.gold::after   { background: var(--gold); }
  .stat-card.indigo::after { background: var(--admin-accent3); }
  .stat-card.teal::after   { background: var(--admin-info); }

  .stat-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .stat-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
  }
  .stat-card.green  .stat-icon { background: rgba(74,222,128,.13); }
  .stat-card.gold   .stat-icon { background: rgba(245,158,11,.13); }
  .stat-card.indigo .stat-icon { background: rgba(99,102,241,.13); }
  .stat-card.teal   .stat-icon { background: rgba(56,189,248,.13); }

  .stat-trend {
    font-family: var(--mono);
    font-size: .68rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .trend-up   { background: rgba(34,197,94,.1);  color: var(--admin-success); }
  .trend-down { background: rgba(239,68,68,.1);  color: var(--admin-danger); }
  .trend-flat { background: rgba(255,255,255,.06); color: var(--admin-muted); }

  .stat-label {
    font-size: .72rem;
    color: var(--admin-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 5px;
  }
  .stat-value {
    font-size: 1.85rem;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    font-family: var(--mono);
    letter-spacing: -.03em;
  }
  .stat-sub {
    font-size: .74rem;
    color: var(--admin-muted);
    margin-top: 6px;
  }
  .stat-sub strong { color: var(--admin-text); font-weight: 600; }

  /* ---- Chart section ---- */
  .chart-section {
    background: var(--admin-card);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-lg);
    padding: 24px 26px 20px;
    margin-bottom: 24px;
    animation: fadeInUp .55s var(--ease) .1s both;
  }
  .chart-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .chart-title {
    font-size: .98rem;
    font-weight: 600;
    color: var(--admin-text);
  }
  .chart-subtitle {
    font-size: .77rem;
    color: var(--admin-muted);
    margin-top: 3px;
  }
  .chart-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: var(--admin-muted);
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .chart-stat-pill {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    text-align: center;
  }
  .chart-stat-pill .value {
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
  }
  .chart-stat-pill .label {
    font-size: .68rem;
    color: var(--admin-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-top: 2px;
  }
  .chart-wrap { position: relative; height: 230px; }

  /* ---- Bottom 2-col grid ---- */
  .dashboard-bottom {
    display: grid;
    grid-template-columns: 60fr 40fr;
    gap: 20px;
    margin-bottom: 24px;
    animation: fadeInUp .6s var(--ease) .15s both;
  }

  /* ---- Recent orders card ---- */
  .orders-card {
    background: var(--admin-card);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--admin-border);
  }
  .card-head-title {
    font-size: .95rem;
    font-weight: 600;
    color: var(--admin-text);
  }
  .card-head-subtitle {
    font-size: .75rem;
    color: var(--admin-muted);
    margin-top: 2px;
  }
  .orders-table-wrap { overflow-x: auto; }
  .orders-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
  }
  .orders-table thead th {
    background: rgba(255,255,255,.03);
    padding: 10px 16px;
    text-align: left;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--admin-muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--admin-border);
  }
  .orders-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: background .15s ease;
  }
  .orders-table tbody tr:last-child { border-bottom: none; }
  .orders-table tbody tr:hover { background: rgba(255,255,255,.03); }
  .orders-table tbody td {
    padding: 13px 16px;
    color: var(--admin-text);
    vertical-align: middle;
  }
  .order-id {
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 500;
    color: var(--admin-accent);
  }
  .customer-name { font-weight: 500; color: var(--admin-text); }
  .customer-country { font-size: .72rem; color: var(--admin-muted); }
  .order-total {
    font-family: var(--mono);
    font-weight: 600;
    color: #fff;
  }
  .order-date { font-size: .73rem; color: var(--admin-muted); }
  .card-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--admin-border);
    text-align: center;
  }

  /* ---- Status badges ---- */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .status-badge::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-pending    { background: rgba(245,158,11,.12); color: #f59e0b; }
  .status-pending::before { background: #f59e0b; }
  .status-processing { background: rgba(56,189,248,.12); color: #38bdf8; }
  .status-processing::before { background: #38bdf8; }
  .status-shipped    { background: rgba(99,102,241,.12); color: #818cf8; }
  .status-shipped::before { background: #818cf8; }
  .status-delivered  { background: rgba(34,197,94,.12);  color: #22c55e; }
  .status-delivered::before { background: #22c55e; }
  .status-cancelled  { background: rgba(239,68,68,.12);  color: #ef4444; }
  .status-cancelled::before { background: #ef4444; }

  /* ---- Top products card ---- */
  .products-card {
    background: var(--admin-card);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .product-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 20px;
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: background .15s ease;
  }
  .product-row:last-child { border-bottom: none; }
  .product-row:hover { background: rgba(255,255,255,.03); }
  .product-rank {
    font-family: var(--mono);
    font-size: .72rem;
    font-weight: 700;
    color: var(--admin-muted);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .product-rank.top { color: var(--gold); }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-size: .82rem;
    font-weight: 600;
    color: var(--admin-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-meta { font-size: .7rem; color: var(--admin-muted); margin-top: 2px; }
  .product-rev-wrap { text-align: right; min-width: 64px; }
  .product-rev {
    font-family: var(--mono);
    font-size: .82rem;
    font-weight: 700;
    color: #fff;
  }
  .rev-bar-outer {
    height: 3px;
    background: rgba(255,255,255,.06);
    border-radius: 4px;
    margin-top: 5px;
    overflow: hidden;
  }
  .rev-bar-inner {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--admin-accent), #22c55e);
    transition: width .8s var(--ease);
  }

  /* ---- Quick actions ---- */
  .quick-actions {
    animation: fadeInUp .65s var(--ease) .2s both;
    margin-bottom: 8px;
  }
  .quick-actions-title {
    font-size: .75rem;
    font-weight: 600;
    color: var(--admin-muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 14px;
  }
  .quick-actions-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .quick-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 22px 16px;
    background: var(--admin-card);
    border: 1px solid var(--admin-border);
    border-radius: var(--radius-lg);
    color: var(--admin-muted);
    font-size: .82rem;
    font-weight: 500;
    text-align: center;
    transition: all .22s var(--ease);
    cursor: pointer;
    text-decoration: none;
  }
  .quick-action-btn:hover {
    background: rgba(255,255,255,.06);
    border-color: rgba(255,255,255,.12);
    color: var(--admin-text);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  .quick-action-icon {
    width: 44px; height: 44px;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .qa-green  .quick-action-icon { background: rgba(74,222,128,.12); }
  .qa-gold   .quick-action-icon { background: rgba(245,158,11,.12); }
  .qa-indigo .quick-action-icon { background: rgba(99,102,241,.12); }
  .qa-info   .quick-action-icon { background: rgba(56,189,248,.12); }
  .qa-green:hover  { border-color: rgba(74,222,128,.25) !important; }
  .qa-gold:hover   { border-color: rgba(245,158,11,.25) !important; }
  .qa-indigo:hover { border-color: rgba(99,102,241,.25) !important; }
  .qa-info:hover   { border-color: rgba(56,189,248,.25) !important; }
  .quick-action-label { line-height: 1.3; }

  /* ---- Animations ---- */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- Responsive ---- */
  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .quick-actions-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 900px) {
    .dashboard-bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; }
    .quick-actions-grid { grid-template-columns: 1fr 1fr; }
    .greeting-left h1 { font-size: 1.25rem; }
    .chart-meta { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>

<div class="admin-main">
  <div class="admin-content" id="dashboard-content">
    <!-- Rendered by initDashboard() after DOMContentLoaded -->
  </div>
</div>

<script src="../js/db.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
/* ============================================================
   GUARD — redirect immediately if not authenticated
   ============================================================ */
AdminAuth.guard();

/* ============================================================
   DASHBOARD INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderAdminLayout('Dashboard', 'Overview');
  initDashboard();
});

function initDashboard() {
  const content = document.getElementById('dashboard-content');

  /* ---- Gather all data ---- */
  const stats      = DB.orders.stats();
  const orders     = DB.orders.getAll();
  const products   = DB.products.getAll();
  const customers  = DB.customers.getAll();
  const topProds   = DB.analytics.topProducts(5);
  const recentOrds = [...orders]
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
    .slice(0, 5);
  const revenue7   = DB.analytics.revenueByDay(7);
  const pending    = stats.pending;

  /* ---- Greeting ---- */
  const hour = new Date().getHours();
  const greetWord = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const session   = AdminAuth.getSession();
  const userName  = session
    ? session.username.charAt(0).toUpperCase() + session.username.slice(1)
    : 'Admin';
  const dateStr   = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  /* ---- Revenue totals for chart mini-stats ---- */
  const weekRev    = revenue7.reduce((s, d) => s + d.revenue, 0);
  const weekOrders = revenue7.reduce((s, d) => s + d.orders, 0);
  const activeProducts = products.filter(p => p.active !== false).length;

  /* ---- Build page HTML ---- */
  content.innerHTML = `

    <!-- Greeting -->
    <div class="dashboard-greeting">
      <div class="greeting-left">
        <h1>${greetWord}, <span>${escHtml(userName)}</span> &#x1F44B;</h1>
        <p>Here's what's happening with your store today.</p>
      </div>
      <div class="greeting-date">${escHtml(dateStr)}</div>
    </div>

    ${pending > 0 ? `
    <div class="pending-alert">
      <span style="font-size:1.1rem;">&#x26A0;&#xFE0F;</span>
      <div>
        <strong>${pending} order${pending !== 1 ? 's' : ''} pending</strong>
        &mdash; ${pending === 1 ? 'It needs' : 'They need'} your attention.
      </div>
      <a href="orders.html">View orders &rarr;</a>
    </div>` : ''}

    <!-- Stat Cards -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- Revenue Chart -->
    <div class="chart-section">
      <div class="chart-header">
        <div>
          <div class="chart-title">Revenue Overview</div>
          <div class="chart-subtitle">Last 7 days &mdash; all non-cancelled orders</div>
        </div>
        <div class="chart-meta">
          <div class="chart-stat-pill">
            <div class="value">$${weekRev.toFixed(2)}</div>
            <div class="label">7-day revenue</div>
          </div>
          <div class="chart-stat-pill">
            <div class="value">${weekOrders}</div>
            <div class="label">7-day orders</div>
          </div>
          <div class="chart-legend-item">
            <div class="legend-dot" style="background:#4ade80;"></div>
            <span>Revenue</span>
          </div>
          <div class="chart-legend-item">
            <div class="legend-dot" style="background:#f59e0b;border-radius:0;width:14px;height:2px;"></div>
            <span>Orders</span>
          </div>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="revenue-chart"></canvas>
      </div>
    </div>

    <!-- Bottom 2-col -->
    <div class="dashboard-bottom">

      <!-- Recent Orders -->
      <div class="orders-card">
        <div class="card-head">
          <div>
            <div class="card-head-title">Recent Orders</div>
            <div class="card-head-subtitle">Last ${recentOrds.length} orders</div>
          </div>
          <a href="orders.html" class="btn btn-secondary btn-sm">View all</a>
        </div>
        <div class="orders-table-wrap">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Total</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-orders-body"></tbody>
          </table>
        </div>
        <div class="card-footer">
          <a href="orders.html"
             style="font-size:.78rem;color:var(--admin-muted);font-weight:500;transition:color .15s ease;"
             onmouseover="this.style.color='var(--admin-text)'"
             onmouseout="this.style.color='var(--admin-muted)'">
            View all ${orders.length} order${orders.length !== 1 ? 's' : ''} &rarr;
          </a>
        </div>
      </div>

      <!-- Top Products -->
      <div class="products-card">
        <div class="card-head">
          <div>
            <div class="card-head-title">Top Products</div>
            <div class="card-head-subtitle">By revenue &mdash; all time</div>
          </div>
          <a href="products.html" class="btn btn-secondary btn-sm">Manage</a>
        </div>
        <div id="top-products-list"></div>
        <div class="card-footer">
          <a href="products.html"
             style="font-size:.78rem;color:var(--admin-muted);font-weight:500;transition:color .15s ease;"
             onmouseover="this.style.color='var(--admin-text)'"
             onmouseout="this.style.color='var(--admin-muted)'">
            Manage all ${activeProducts} active product${activeProducts !== 1 ? 's' : ''} &rarr;
          </a>
        </div>
      </div>

    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <div class="quick-actions-title">Quick Actions</div>
      <div class="quick-actions-grid">
        <a href="products.html" class="quick-action-btn qa-green">
          <div class="quick-action-icon">&#x1F4E6;</div>
          <div class="quick-action-label">Add Product</div>
        </a>
        <a href="orders.html" class="quick-action-btn qa-gold">
          <div class="quick-action-icon">&#x1F6D2;</div>
          <div class="quick-action-label">View Orders</div>
        </a>
        <a href="coupons.html" class="quick-action-btn qa-indigo">
          <div class="quick-action-icon">&#x1F39F;</div>
          <div class="quick-action-label">Manage Coupons</div>
        </a>
        <a href="customers.html" class="quick-action-btn qa-info">
          <div class="quick-action-icon">&#x1F465;</div>
          <div class="quick-action-label">View Customers</div>
        </a>
      </div>
    </div>

  `;

  /* ---- Populate sub-sections ---- */
  renderStatCards({ stats, products, customers, activeProducts });
  renderRecentOrders(recentOrds);
  renderTopProducts(topProds);
  drawRevenueChart(revenue7);
}

/* ============================================================
   STAT CARDS
   ============================================================ */
function renderStatCards({ stats, products, customers, activeProducts }) {
  const grid = document.getElementById('stats-grid');
  if (!grid) return;

  const cards = [
    {
      color: 'green',
      icon: '&#x1F4B0;',
      label: 'Total Revenue',
      value: '$' + Number(stats.revenue).toFixed(2),
      sub: `<strong>$${Number(stats.monthlyRevenue).toFixed(2)}</strong> this month`,
      trend: stats.monthlyRevenue > 0 ? 'up' : 'flat',
      trendLabel: stats.monthlyRevenue > 0
        ? '&uarr; $' + Number(stats.monthlyRevenue).toFixed(0) + ' / mo'
        : '&mdash; No sales yet',
    },
    {
      color: 'gold',
      icon: '&#x1F6D2;',
      label: 'Total Orders',
      value: stats.total,
      sub: `<strong>${stats.monthlyOrders}</strong> this month`,
      trend: stats.pending > 0 ? 'down' : 'up',
      trendLabel: stats.pending > 0
        ? stats.pending + ' pending'
        : '&#x2713; All fulfilled',
    },
    {
      color: 'indigo',
      icon: '&#x1F465;',
      label: 'Customers',
      value: customers.length,
      sub: `<strong>${customers.length}</strong> registered`,
      trend: 'up',
      trendLabel: '&uarr; Growing',
    },
    {
      color: 'teal',
      icon: '&#x1F4E6;',
      label: 'Products',
      value: activeProducts,
      sub: `<strong>${products.length - activeProducts}</strong> inactive`,
      trend: activeProducts > 0 ? 'up' : 'flat',
      trendLabel: activeProducts + ' active',
    },
  ];

  grid.innerHTML = cards.map((c, i) => `
    <div class="stat-card ${c.color}" style="animation-delay:${i * 0.07}s">
      <div class="stat-top">
        <div class="stat-icon">${c.icon}</div>
        <div class="stat-trend trend-${c.trend}">${c.trendLabel}</div>
      </div>
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>
  `).join('');
}

/* ============================================================
   RECENT ORDERS TABLE
   ============================================================ */
function renderRecentOrders(orders) {
  const tbody = document.getElementById('recent-orders-body');
  if (!tbody) return;

  if (!orders.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--admin-muted);">No orders yet</td></tr>`;
    return;
  }

  const statusMap = {
    pending:    'status-pending',
    processing: 'status-processing',
    shipped:    'status-shipped',
    delivered:  'status-delivered',
    cancelled:  'status-cancelled',
  };

  tbody.innerHTML = orders.map(o => {
    const cls   = statusMap[o.status] || 'status-pending';
    const label = o.status.charAt(0).toUpperCase() + o.status.slice(1);
    const date  = new Date(o.createdAt);
    const rel   = formatRelDate(date);
    const qty   = (o.items || []).reduce((s, i) => s + (i.qty || 1), 0);

    return `
      <tr>
        <td>
          <div class="order-id">${escHtml(o.id)}</div>
          <div style="font-size:.7rem;color:var(--admin-muted);margin-top:2px;">${qty} item${qty !== 1 ? 's' : ''}</div>
        </td>
        <td>
          <div class="customer-name">${escHtml(o.customer.name)}</div>
          <div class="customer-country">${escHtml(o.customer.country || '')}</div>
        </td>
        <td><span class="status-badge ${cls}">${label}</span></td>
        <td>
          <div class="order-total">$${Number(o.total).toFixed(2)}</div>
          <div style="font-size:.7rem;color:var(--admin-muted);text-transform:capitalize;">${escHtml(o.paymentMethod || '')}</div>
        </td>
        <td>
          <div class="order-date">${rel}</div>
          <div style="font-size:.68rem;color:rgba(255,255,255,.22);">${date.toLocaleDateString('en-US', { month:'short', day:'numeric' })}</div>
        </td>
      </tr>
    `;
  }).join('');
}

/* ============================================================
   TOP PRODUCTS LIST
   ============================================================ */
function renderTopProducts(products) {
  const el = document.getElementById('top-products-list');
  if (!el) return;

  if (!products.length) {
    el.innerHTML = `<div style="padding:48px;text-align:center;color:var(--admin-muted);">No sales data yet</div>`;
    return;
  }

  const maxRev = Math.max(...products.map(p => p.revenue), 0.01);

  el.innerHTML = products.map((p, i) => {
    const barW  = Math.round((p.revenue / maxRev) * 100);
    const isTop = i === 0;

    return `
      <div class="product-row">
        <div class="product-rank ${isTop ? 'top' : ''}">${isTop ? '&#x1F947;' : '#' + (i + 1)}</div>
        <div class="product-info">
          <div class="product-name" title="${escHtml(p.name)}">${escHtml(p.name)}</div>
          <div class="product-meta">${p.qty} unit${p.qty !== 1 ? 's' : ''} sold</div>
          <div class="rev-bar-outer">
            <div class="rev-bar-inner" style="width:${barW}%;"></div>
          </div>
        </div>
        <div class="product-rev-wrap">
          <div class="product-rev">$${p.revenue.toFixed(2)}</div>
        </div>
      </div>
    `;
  }).join('');
}

/* ============================================================
   REVENUE CHART (Chart.js — gradient fill, dual axis)
   ============================================================ */
function drawRevenueChart(data) {
  const canvas = document.getElementById('revenue-chart');
  if (!canvas || typeof Chart === 'undefined') return;

  const ctx = canvas.getContext('2d');

  /* Gradient fill */
  const grad = ctx.createLinearGradient(0, 0, 0, 230);
  grad.addColorStop(0,    'rgba(74, 222, 128, 0.30)');
  grad.addColorStop(0.55, 'rgba(74, 222, 128, 0.07)');
  grad.addColorStop(1,    'rgba(74, 222, 128, 0.00)');

  const labels   = data.map(d => d.label);
  const revenues = data.map(d => d.revenue);
  const orderCts = data.map(d => d.orders);

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Revenue ($)',
          data: revenues,
          borderColor: '#4ade80',
          backgroundColor: grad,
          borderWidth: 2.5,
          pointBackgroundColor: '#4ade80',
          pointBorderColor: '#0f1117',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          tension: 0.38,
          fill: true,
          yAxisID: 'y',
        },
        {
          label: 'Orders',
          data: orderCts,
          borderColor: 'rgba(245,158,11,.75)',
          backgroundColor: 'transparent',
          borderWidth: 1.8,
          borderDash: [5, 4],
          pointBackgroundColor: '#f59e0b',
          pointBorderColor: '#0f1117',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0.38,
          fill: false,
          yAxisID: 'y2',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1d2e',
          borderColor: 'rgba(255,255,255,.1)',
          borderWidth: 1,
          titleColor: '#e2e8f0',
          bodyColor: '#8892a4',
          padding: 12,
          cornerRadius: 8,
          callbacks: {
            label(ctx) {
              if (ctx.datasetIndex === 0)
                return '  Revenue: $' + Number(ctx.raw).toFixed(2);
              return '  Orders: ' + ctx.raw;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,.05)' },
          ticks: { color: '#8892a4', font: { size: 11 } },
          border: { display: false },
        },
        y: {
          position: 'left',
          grid: { color: 'rgba(255,255,255,.05)' },
          ticks: {
            color: '#8892a4',
            font: { size: 11 },
            callback: v => '$' + Number(v).toFixed(0)
          },
          border: { display: false },
        },
        y2: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#8892a4',
            font: { size: 11 },
            stepSize: 1,
            callback: v => Number.isInteger(v) ? v : '',
          },
          border: { display: false },
        }
      },
      animation: { duration: 900, easing: 'easeOutQuart' }
    }
  });
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatRelDate(date) {
  const now    = Date.now();
  const diffMs = now - date.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  const diffH   = Math.floor(diffMs / 3600000);
  const diffD   = Math.floor(diffMs / 86400000);

  if (diffMin < 2)  return 'Just now';
  if (diffMin < 60) return diffMin + 'm ago';
  if (diffH < 24)   return diffH + 'h ago';
  if (diffD === 1)  return 'Yesterday';
  if (diffD < 7)    return diffD + ' days ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
