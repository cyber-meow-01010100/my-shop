<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — Alchimia Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-main">
  <div class="admin-content">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-left">
        <h1>Coupons</h1>
        <p>Discount codes and promotional offers</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" onclick="openAddCoupon()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Coupon
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="coupon-stats">
      <div class="stat-card green">
        <div class="stat-icon">🎟️</div>
        <div class="stat-label">Total Coupons</div>
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-change up">All codes</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-icon">✅</div>
        <div class="stat-label">Active Coupons</div>
        <div class="stat-value" id="stat-active">—</div>
        <div class="stat-change up">Currently live</div>
      </div>
      <div class="stat-card indigo">
        <div class="stat-icon">🔄</div>
        <div class="stat-label">Total Uses</div>
        <div class="stat-value" id="stat-used">—</div>
        <div class="stat-change up">All time</div>
      </div>
      <div class="stat-card red">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Est. Revenue Saved</div>
        <div class="stat-value" id="stat-saved">—</div>
        <div class="stat-change" id="stat-saved-note" style="color:var(--admin-muted);">Approx. discount given</div>
      </div>
    </div>

    <!-- Coupons Table -->
    <div class="card" style="padding:0;">
      <div class="card-header" style="padding:20px 24px 0;">
        <div>
          <div class="card-title">Coupon Codes</div>
          <div class="card-subtitle" id="coupon-count-label">Loading…</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <div class="search-input-wrap" style="max-width:220px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-coupons" placeholder="Search codes…" oninput="renderCoupons()">
          </div>
          <select class="filter-select" id="filter-status" onchange="renderCoupons()">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <select class="filter-select" id="filter-type" onchange="renderCoupons()">
            <option value="">All Types</option>
            <option value="percent">Percent (%)</option>
            <option value="fixed">Fixed ($)</option>
          </select>
        </div>
      </div>
      <div style="padding:16px 24px 24px;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Type</th>
                <th>Value</th>
                <th>Min Order</th>
                <th>Used / Limit</th>
                <th>Expires</th>
                <th style="text-align:center;">Status</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="coupons-tbody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--admin-muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Add / Edit Coupon Modal -->
<div class="modal-overlay" id="coupon-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="coupon-modal-title">Add Coupon</div>
      <button class="modal-close" onclick="closeModal('coupon-modal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-coupon-id">

      <div class="form-group">
        <label for="coupon-code">Coupon Code <span style="color:var(--admin-danger)">*</span></label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="coupon-code" class="form-control" placeholder="e.g. SAVE20" oninput="this.value=this.value.toUpperCase()" style="flex:1;font-family:var(--mono);font-size:.9rem;letter-spacing:.06em;">
          <button type="button" class="btn btn-secondary" onclick="generateCode()" title="Generate random code">🎲 Generate</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="coupon-type">Discount Type <span style="color:var(--admin-danger)">*</span></label>
          <select id="coupon-type" class="form-control" onchange="updateValueLabel()">
            <option value="percent">Percentage (%)</option>
            <option value="fixed">Fixed Amount ($)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="coupon-value" id="coupon-value-label">Discount Value (%) <span style="color:var(--admin-danger)">*</span></label>
          <input type="number" id="coupon-value" class="form-control" placeholder="10" min="0" step="0.01">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="coupon-min">Minimum Order ($)</label>
          <input type="number" id="coupon-min" class="form-control" placeholder="0" min="0" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label for="coupon-limit">Usage Limit</label>
          <input type="number" id="coupon-limit" class="form-control" placeholder="Unlimited" min="0" step="1">
        </div>
      </div>

      <div class="form-group">
        <label for="coupon-expires">Expiry Date</label>
        <input type="date" id="coupon-expires" class="form-control">
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <label class="toggle">
            <input type="checkbox" id="coupon-active" checked>
            <span class="toggle-slider"></span>
          </label>
          <span style="font-size:.85rem;color:var(--admin-text);">Active (usable on checkout)</span>
        </label>
      </div>

      <div id="coupon-error" style="color:var(--admin-danger);font-size:.82rem;min-height:18px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('coupon-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveCoupon()" id="save-coupon-btn">Save Coupon</button>
    </div>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
AdminAuth.guard();
renderAdminLayout('Coupons', 'Discount codes');

/* ── Stats ── */
function updateStats() {
  const coupons = DB.coupons.getAll();
  const active  = coupons.filter(c => c.active).length;
  const used    = coupons.reduce((s, c) => s + (c.used || 0), 0);

  /* Estimate revenue saved: sum of (used × avg_discount_value) */
  let saved = 0;
  coupons.forEach(c => {
    if (c.type === 'fixed') saved += (c.used || 0) * c.value;
    else saved += (c.used || 0) * ((c.minOrder || 25) * c.value / 100); /* rough estimate */
  });

  document.getElementById('stat-total').textContent  = coupons.length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-used').textContent   = used;
  document.getElementById('stat-saved').textContent  = fmtCurrency(saved);
}

/* ── Render coupons table ── */
function renderCoupons() {
  const query  = (document.getElementById('search-coupons').value || '').toLowerCase();
  const status = document.getElementById('filter-status').value;
  const type   = document.getElementById('filter-type').value;
  const tbody  = document.getElementById('coupons-tbody');

  let coupons = DB.coupons.getAll();

  if (query)  coupons = coupons.filter(c => c.code.toLowerCase().includes(query));
  if (status === 'active')   coupons = coupons.filter(c => c.active);
  if (status === 'inactive') coupons = coupons.filter(c => !c.active);
  if (type)   coupons = coupons.filter(c => c.type === type);

  document.getElementById('coupon-count-label').textContent =
    `${coupons.length} coupon${coupons.length === 1 ? '' : 's'}`;

  if (!coupons.length) {
    tbody.innerHTML = `<tr><td colspan="8">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="5" width="22" height="14" rx="3"/><line x1="8" y1="12" x2="16" y2="12" stroke-dasharray="2 2"/></svg>
        <h3>No coupons found</h3>
        <p>Add your first discount code to get started.</p>
      </div>
    </td></tr>`;
    return;
  }

  const now = new Date();
  tbody.innerHTML = coupons.map(c => {
    const isExpired  = c.expiresAt && new Date(c.expiresAt) < now;
    const limitPct   = c.usageLimit ? (c.used || 0) / c.usageLimit * 100 : 0;
    const usageBar   = c.usageLimit
      ? `<div style="width:60px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:4px;">
           <div style="height:100%;width:${Math.min(limitPct,100)}%;background:${limitPct >= 90 ? 'var(--admin-danger)' : limitPct >= 60 ? 'var(--admin-warning)' : 'var(--admin-accent)'};border-radius:4px;"></div>
         </div>`
      : '';

    let statusBadge;
    if (!c.active)       statusBadge = `<span class="badge badge-muted">Inactive</span>`;
    else if (isExpired)  statusBadge = `<span class="badge badge-danger">Expired</span>`;
    else                 statusBadge = `<span class="badge badge-success">● Active</span>`;

    const typeChip = c.type === 'percent'
      ? `<span class="badge badge-info">% Percent</span>`
      : `<span class="badge badge-warning">$ Fixed</span>`;

    const valueDisplay = c.type === 'percent'
      ? `<strong>${c.value}%</strong> off`
      : `<strong>$${Number(c.value).toFixed(2)}</strong> off`;

    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <code style="font-size:.85rem;color:var(--admin-accent);background:rgba(74,222,128,.1);padding:4px 10px;border-radius:6px;font-weight:700;letter-spacing:.06em;">${escHtml(c.code)}</code>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="copyCode('${escAttr(c.code)}')" title="Copy code" style="color:var(--admin-muted);">📋</button>
        </div>
      </td>
      <td>${typeChip}</td>
      <td style="font-size:.88rem;">${valueDisplay}</td>
      <td style="color:var(--admin-muted);">${c.minOrder ? fmtCurrency(c.minOrder) : <span style="color:var(--admin-muted);font-size:.8rem;">None</span>}</td>
      <td>
        <div style="font-size:.82rem;color:var(--admin-text);">${c.used || 0} / ${c.usageLimit || <span style="color:var(--admin-muted);">∞</span>}</div>
        ${usageBar}
      </td>
      <td style="font-size:.82rem;color:${isExpired ? 'var(--admin-danger)' : 'var(--admin-muted)'};">${c.expiresAt ? fmtDate(c.expiresAt) : '—'}</td>
      <td style="text-align:center;">${statusBadge}</td>
      <td style="text-align:right;">
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn btn-secondary btn-sm" onclick="editCoupon('${c.id}')">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${c.id}','${escAttr(c.code)}')">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

/* ── Copy code to clipboard ── */
function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => {
    adminToast(`Code "${code}" copied to clipboard!`, 'success');
  }).catch(() => {
    adminToast('Failed to copy — please copy manually.', 'warning');
  });
}

/* ── Generate random code ── */
function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('coupon-code').value = code;
}

/* ── Update value label based on type ── */
function updateValueLabel() {
  const type = document.getElementById('coupon-type').value;
  document.getElementById('coupon-value-label').textContent =
    (type === 'percent' ? 'Discount Value (%)' : 'Discount Value ($)') + ' *';
}

/* ── Open Add modal ── */
function openAddCoupon() {
  document.getElementById('edit-coupon-id').value = '';
  document.getElementById('coupon-modal-title').textContent = 'Add Coupon';
  document.getElementById('coupon-code').value = '';
  document.getElementById('coupon-type').value = 'percent';
  document.getElementById('coupon-value').value = '';
  document.getElementById('coupon-min').value = '0';
  document.getElementById('coupon-limit').value = '';
  document.getElementById('coupon-expires').value = '';
  document.getElementById('coupon-active').checked = true;
  document.getElementById('coupon-error').textContent = '';
  document.getElementById('save-coupon-btn').textContent = 'Save Coupon';
  updateValueLabel();
  openModal('coupon-modal');
  setTimeout(() => document.getElementById('coupon-code').focus(), 100);
}

/* ── Open Edit modal ── */
function editCoupon(id) {
  const c = DB.coupons.getById(id);
  if (!c) return;
  document.getElementById('edit-coupon-id').value = c.id;
  document.getElementById('coupon-modal-title').textContent = 'Edit Coupon';
  document.getElementById('coupon-code').value = c.code;
  document.getElementById('coupon-type').value = c.type;
  document.getElementById('coupon-value').value = c.value;
  document.getElementById('coupon-min').value = c.minOrder || 0;
  document.getElementById('coupon-limit').value = c.usageLimit || '';
  document.getElementById('coupon-expires').value = c.expiresAt || '';
  document.getElementById('coupon-active').checked = !!c.active;
  document.getElementById('coupon-error').textContent = '';
  document.getElementById('save-coupon-btn').textContent = 'Update Coupon';
  updateValueLabel();
  openModal('coupon-modal');
}

/* ── Save coupon ── */
function saveCoupon() {
  const id      = document.getElementById('edit-coupon-id').value;
  const code    = document.getElementById('coupon-code').value.trim().toUpperCase();
  const type    = document.getElementById('coupon-type').value;
  const value   = parseFloat(document.getElementById('coupon-value').value);
  const minOrder= parseFloat(document.getElementById('coupon-min').value) || 0;
  const limitRaw= document.getElementById('coupon-limit').value.trim();
  const usageLimit = limitRaw ? parseInt(limitRaw) : null;
  const expiresAt  = document.getElementById('coupon-expires').value || null;
  const active  = document.getElementById('coupon-active').checked;
  const errEl   = document.getElementById('coupon-error');

  if (!code) { errEl.textContent = 'Coupon code is required.'; return; }
  if (isNaN(value) || value <= 0) { errEl.textContent = 'Discount value must be a positive number.'; return; }
  if (type === 'percent' && value > 100) { errEl.textContent = 'Percentage discount cannot exceed 100%.'; return; }

  /* Code uniqueness */
  const all = DB.coupons.getAll();
  const dup = all.find(c => c.code.toUpperCase() === code && c.id !== id);
  if (dup) { errEl.textContent = `Code "${code}" already exists.`; return; }

  const data = { code, type, value, minOrder, usageLimit, expiresAt, active };

  if (id) {
    DB.coupons.update(id, data);
    adminToast('Coupon updated successfully', 'success');
  } else {
    DB.coupons.add(data);
    adminToast('Coupon created successfully', 'success');
  }

  closeModal('coupon-modal');
  updateStats();
  renderCoupons();
}

/* ── Delete coupon ── */
function deleteCoupon(id, code) {
  if (!adminConfirm(`Delete coupon "${code}"? This cannot be undone.`)) return;
  DB.coupons.delete(id);
  adminToast('Coupon deleted', 'success');
  updateStats();
  renderCoupons();
}

/* ── Helpers ── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

/* ── Init ── */
updateStats();
renderCoupons();
</script>
</body>
</html>
