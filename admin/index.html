<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Buy Alchimia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page" style="display:block;">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span>Buy</span>Alchimia</div>
    <div style="text-align:center;margin-bottom:24px;">
      <span style="display:inline-block;background:linear-gradient(135deg,rgba(46,125,50,.2),rgba(74,222,128,.1));border:1px solid rgba(74,222,128,.2);border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 14px;color:#4ade80;">Admin Dashboard</span>
    </div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Sign in to your admin panel</div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required style="padding-right:2.8rem;">
          <button type="button" id="toggle-pwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;color:rgba(255,255,255,.3);font-size:1rem;padding:4px;" title="Show/hide password">👁</button>
        </div>
      </div>

      <div class="auth-error" id="login-error"></div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.75rem;font-size:.95rem;margin-top:8px;" id="login-btn">
        Sign In
      </button>
    </form>

    <div style="margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07);text-align:center;">
      <div style="display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:10px;">
        <div style="width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s ease-in-out infinite;"></div>
        <span style="font-size:.75rem;color:rgba(255,255,255,.4);">Demo credentials</span>
      </div>
      <code style="font-size:.78rem;color:rgba(255,255,255,.35);background:rgba(255,255,255,.04);padding:8px 16px;border-radius:6px;display:inline-block;">admin / alchimia2026</code>
    </div>

    <div style="margin-top:20px;text-align:center;">
      <a href="../index.html" style="font-size:.78rem;color:rgba(255,255,255,.3);text-decoration:none;transition:color .15s ease;" onmouseover="this.style.color='rgba(255,255,255,.6)'" onmouseout="this.style.color='rgba(255,255,255,.3)'">← Back to storefront</a>
    </div>
  </div>
</div>

<style>
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:.4; transform:scale(1.3); }
}
</style>

<script>
// Redirect if already logged in
(function() {
  const session = localStorage.getItem("alchimia_admin_session");
  if (session) {
    try {
      const data = JSON.parse(atob(session));
      if (data.expires > Date.now()) {
        window.location.href = "dashboard.html";
        return;
      }
    } catch(e) {}
  }
})();
</script>

<script src="js/admin-auth.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("login-error");
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  btn.textContent = "Signing in…";
  btn.disabled = true;
  errEl.textContent = "";

  const result = await AdminAuth.login(username, password);
  if (result.success) {
    btn.textContent = "✓ Success";
    btn.style.background = "linear-gradient(135deg, #4ade80, #22c55e)";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 600);
  } else {
    errEl.textContent = result.error;
    btn.textContent = "Sign In";
    btn.disabled = false;
    // Shake animation
    const card = document.querySelector(".auth-card");
    card.style.animation = "shake .4s ease";
    setTimeout(() => card.style.animation = "", 400);
  }
});

document.getElementById("toggle-pwd").addEventListener("click", () => {
  const pwd = document.getElementById("password");
  pwd.type = pwd.type === "password" ? "text" : "password";
});
</script>

<style>
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
</style>
</body>
</html>
